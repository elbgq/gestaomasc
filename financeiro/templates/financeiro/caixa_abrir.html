{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h3>Abertura do Caixa - {{ caixa.nome }}</h3>

    <form method="post">
        {% csrf_token %}
        <p class="text-muted">Saldo do caixa no sistema: R$ {{ saldo|floatformat:2 }}. Informe o valor contado; se for diferente, o sistema avisa.</p>
        <label>Valor de Abertura</label>
        <input type="number" step="0.01" min="0" name="valor_abertura" value="{{ saldo|stringformat:'.2f' }}" class="form-control" required>

        <button class="btn btn-success mt-3">Abrir Caixa</button>
    </form>
</div>
{% endblock %}
