{# Campos da quitação: data, valor quitado (parcial), juros, multa, desconto e total #}
<div class="row g-3 mb-3" style="max-width: 760px">
    <div class="col-md-4">
        <label class="form-label">Data</label>
        <input type="date" name="data_pagamento" value="{{ hoje|date:'Y-m-d' }}" class="form-control" required>
    </div>
    <div class="col-md-4">
        <label class="form-label">Valor quitado</label>
        <input type="number" step="0.01" min="0.01" max="{{ titulo.valor|stringformat:'.2f' }}" name="valor_quitado"
               value="{{ titulo.valor|stringformat:'.2f' }}" class="form-control campo-quitacao" required>
        <div class="form-text">Menor que o título = pagamento parcial; o restante fica em aberto.</div>
    </div>
    <div class="col-md-4"></div>
    <div class="col-md-4">
        <label class="form-label">Juros</label>
        <input type="number" step="0.01" min="0" name="valor_juros" value="0.00" class="form-control campo-quitacao">
    </div>
    <div class="col-md-4">
        <label class="form-label">Multa</label>
        <input type="number" step="0.01" min="0" name="valor_multa" value="0.00" class="form-control campo-quitacao">
    </div>
    <div class="col-md-4">
        <label class="form-label">Desconto</label>
        <input type="number" step="0.01" min="0" name="valor_desconto" value="0.00" class="form-control campo-quitacao">
    </div>
</div>
<p class="fs-5">Total {% if titulo.tipo == "R" %}recebido{% else %}pago{% endif %}: <strong id="total-quitacao">R$ {{ titulo.valor|floatformat:2 }}</strong></p>

<script>
(function () {
    const campos = document.querySelectorAll(".campo-quitacao");
    const valor = nome => parseFloat(document.querySelector(`[name=${nome}]`).value.replace(",", ".")) || 0;
    function atualizar() {
        const total = valor("valor_quitado") + valor("valor_juros") + valor("valor_multa") - valor("valor_desconto");
        document.getElementById("total-quitacao").textContent =
            "R$ " + total.toLocaleString("pt-BR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
    }
    campos.forEach(c => c.addEventListener("input", atualizar));
})();
</script>
